# Stack DEVELOPMENT backend + frontend (kode di-mount, dev dependencies lengkap):
#   docker compose -f docker-compose.dev.yml up -d --build
# Buka http://localhost:5173 (Vite dev server). /api diproxy Vite ke nginx di jaringan Docker,
# jadi API tidak dibuka ke host. Syarat: repo frontend di folder sejajar `../frontend`.
# Jangan jalankan bersamaan dengan docker-compose.yml.
# `queue` & `scheduler` OPSIONAL (profile `worker`) — bind mount kode di Windows lambat, tiga container PHP yang
# me-mount folder yang sama memperberat I/O. Nyalakan saat mengerjakan job/jadwal:
#   docker compose -f docker-compose.dev.yml --profile worker up -d
# Restart manual setelah mengubah kode job: docker compose -f docker-compose.dev.yml restart queue

name: eklinik-dev

services:
  app:
    build: ./docker/php
    container_name: eklinik-dev-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  queue:
    profiles: ["worker"]
    build: ./docker/php
    container_name: eklinik-dev-queue
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --backoff=30
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    profiles: ["worker"]
    build: ./docker/php
    container_name: eklinik-dev-scheduler
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: eklinik-dev-nginx
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  frontend:
    image: node:24-alpine
    container_name: eklinik-dev-frontend
    working_dir: /app
    # npm ci hanya bila node_modules (volume) masih kosong; jalankan ulang manual bila package-lock berubah:
    #   docker compose -f docker-compose.dev.yml exec frontend npm ci
    command: sh -c "[ -x node_modules/.bin/vite ] || npm ci; exec npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: /api
      API_PROXY_TARGET: http://nginx
      VITE_USE_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - nginx

  db:
    image: postgres:17-alpine
    container_name: eklinik-dev-db
    environment:
      POSTGRES_DB: eklinik
      POSTGRES_USER: eklinik
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eklinik -d eklinik"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  frontend_node_modules:
