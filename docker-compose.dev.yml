# Stack DEVELOPMENT backend saja (kode di-mount, dev dependencies lengkap):
#   docker compose -f docker-compose.dev.yml up -d --build
# Frontend dijalankan terpisah dengan `npm run dev`. Jangan jalankan bersamaan dengan docker-compose.yml (port sama).
# `queue` & `scheduler` OPSIONAL (profile `worker`) — bind mount kode di Windows lambat, tiga container PHP yang
# me-mount folder yang sama memperberat I/O. Nyalakan saat mengerjakan job/jadwal:
#   docker compose -f docker-compose.dev.yml --profile worker up -d
# Restart manual setelah mengubah kode job: docker compose -f docker-compose.dev.yml restart queue

name: eklinik-dev

services:
  app:
    build: ./docker/php
    container_name: eklinik-dev-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  queue:
    profiles: ["worker"]
    build: ./docker/php
    container_name: eklinik-dev-queue
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --backoff=30
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    profiles: ["worker"]
    build: ./docker/php
    container_name: eklinik-dev-scheduler
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: eklinik-dev-nginx
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    container_name: eklinik-dev-db
    environment:
      POSTGRES_DB: eklinik
      POSTGRES_USER: eklinik
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eklinik -d eklinik"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
