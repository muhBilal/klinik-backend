# Stack DEVELOPMENT backend saja (kode di-mount, dev dependencies lengkap):
#   docker compose -f docker-compose.dev.yml up -d --build
# Frontend dijalankan terpisah dengan `npm run dev`. Jangan jalankan bersamaan dengan docker-compose.yml (port sama).

name: eklinik-dev

services:
  app:
    build: ./docker/php
    container_name: eklinik-dev-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: eklinik-dev-nginx
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    container_name: eklinik-dev-db
    environment:
      POSTGRES_DB: eklinik
      POSTGRES_USER: eklinik
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eklinik -d eklinik"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
